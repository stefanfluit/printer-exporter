name: Release

# Pushing a tag like v1.2.3 builds the container image for amd64 and arm64,
# publishes it to ghcr.io, and creates a GitHub release with the static
# binaries extracted from those same images.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Jobs opt in to exactly the permissions they need.
permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive names
        run: |
          version=${GITHUB_REF_NAME#v}
          crate_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [[ $version != "$crate_version" ]]; then
              echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version" >&2
              exit 1
          fi
          {
              echo "VERSION=$version"
              echo "IMAGE=$REGISTRY/${GITHUB_REPOSITORY,,}"
          } >>"$GITHUB_ENV"

      - name: Build image
        run: |
          docker build -f Containerfile \
              --build-arg "VERSION=$VERSION" \
              --build-arg "REVISION=$GITHUB_SHA" \
              -t "$IMAGE:$VERSION-$ARCH" .

      - name: Smoke test
        run: ./.github/smoke-test.sh "$IMAGE:$VERSION-$ARCH"

      - name: Package the binary from the image
        run: |
          name=printer_exporter-$VERSION-linux-$ARCH
          mkdir "$name"
          cid=$(docker create "$IMAGE:$VERSION-$ARCH")
          docker cp "$cid:/printer_exporter" "$name/printer_exporter"
          docker rm "$cid" >/dev/null
          cp README.md "$name/"
          tar --owner=0 --group=0 --numeric-owner -czf "$name.tar.gz" "$name"

      - name: Push image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          docker push "$IMAGE:$VERSION-$ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.arch }}
          path: printer_exporter-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      packages: write # push the multi-arch manifest
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Publish multi-arch image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          image=$REGISTRY/${GITHUB_REPOSITORY,,}
          docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          docker buildx imagetools create \
              -t "$image:$version" -t "$image:latest" \
              "$image:$version-amd64" "$image:$version-arm64"

      - name: Checksums
        run: sha256sum printer_exporter-*.tar.gz | tee SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: printer_exporter-*.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          image=$REGISTRY/${GITHUB_REPOSITORY,,}
          cat >notes.md <<NOTES
          ## Container image

          \`\`\`sh
          podman run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \\
              -p 9109:9109 -e PRINTER_TARGET=<printer> $image:$version
          \`\`\`

          ## Binaries

          Static Linux binaries for amd64 and arm64 are attached. Verify a download with:

          \`\`\`sh
          sha256sum -c SHA256SUMS --ignore-missing
          gh attestation verify printer_exporter-$version-linux-amd64.tar.gz --repo $GITHUB_REPOSITORY
          \`\`\`
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag \
              printer_exporter-*.tar.gz SHA256SUMS
